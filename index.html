*,*::before,*::after { box-sizing:border-box; margin:0; padding:0; }
:root {
  --on:  #D4A400;
  --off: #181200;
  --bg:      #000;
  --bg-cell: #050505;
  --bg-hdr:  #080808;
  --border:  #151515;
  --dim:     #555;
  --muted:   #2e2e2e;
  --dst:     #4a9eff;
  --seg:     'DSEG7Bold', monospace;
  --ui:      'Courier New', Courier, monospace;
}

html, body { background:var(--bg); color:#ccc; font-family:var(--ui); min-height:100vh; }

/* ── CLOCK BODY — hidden until font confirmed loaded ── */
#clock-body { opacity:0; transition:opacity 0.15s ease; }
#clock-body.ready { opacity:1; }

/* ── CALCULATOR ── */
#calc-section { background:#060606; padding:14px 16px; }
#calc-display-wrap { border-bottom:1px solid #0f0f0f; margin-bottom:10px; padding-bottom:6px; }
#calc-expr { font-size:9px; color:#2a2a2a; text-align:right; letter-spacing:1px; min-height:14px; font-family:var(--ui); }
#calc-main { font-size:28px; color:var(--on); text-align:right; letter-spacing:2px; font-family:var(--seg); overflow-wrap:anywhere; }
#calc-rate { font-size:8px; text-align:right; letter-spacing:1px; min-height:13px; margin-top:2px; font-family:var(--ui); color:#1a2a1a; }
#calc-rate.live   { color:#1e4a1e; }
#calc-rate.manual { color:#4a3a0a; }
#calc-rate.cached { color:#4a3a0a; }
#calc-rate-row { display:flex; align-items:center; gap:8px; margin-bottom:10px; }
#calc-rate-lbl { font-size:8px; letter-spacing:2px; color:#2a2a2a; text-transform:uppercase; font-family:var(--ui); white-space:nowrap; }
#calc-rate-input { background:#0a0a0a; border:1px solid #1e1e1e; color:var(--on); font-family:var(--ui); font-size:12px; letter-spacing:2px; padding:6px 8px; border-radius:2px; width:80px; text-align:right; -webkit-appearance:none; appearance:none; }
#calc-rate-input:focus { outline:none; border-color:var(--on); }
#calc-rate-input::placeholder { color:#2a2a2a; }
#calc-rate-badge { font-size:7px; letter-spacing:1px; padding:2px 6px; border-radius:2px; text-transform:uppercase; font-family:var(--ui); white-space:nowrap; border:1px solid; }
#calc-rate-badge.live    { color:#1e4a1e; border-color:#122a12; }
#calc-rate-badge.manual  { color:#6a4a0a; border-color:#3a2a08; }
#calc-rate-badge.cached  { color:#6a4a0a; border-color:#3a2a08; }
#calc-rate-badge.offline { color:#5a1e1e; border-color:#2a0e0e; }
#calc-rate-clear { background:transparent; border:1px solid #1a1a1a; color:#2a2a2a; font-family:var(--ui); font-size:8px; letter-spacing:1px; padding:3px 7px; border-radius:2px; cursor:pointer; text-transform:uppercase; }
#calc-rate-clear:hover { border-color:#444; color:#555; }
#calc-grid { display:grid; grid-template-columns:repeat(4,1fr); gap:4px; }
.ck { background:#0a0a0a; border:1px solid #1a1a1a; color:#555; font-family:var(--ui); font-size:11px; letter-spacing:1px; padding:8px 4px; text-align:center; cursor:pointer; border-radius:2px; user-select:none; -webkit-user-select:none; touch-action:manipulation; transition:color .1s, border-color .1s; }
.ck:hover { color:#888; border-color:#333; }
.ck.op  { color:var(--on); border-color:#2a2000; }
.ck.op:hover { border-color:var(--on); }
.ck.eq  { background:#140e00; border-color:var(--on); color:var(--on); }
.ck.zero { grid-column:span 2; }
.ck.clr { color:#8b2020; border-color:#2a0808; }
.ck.clr:hover { color:#c0392b; }
.ck.fx  { color:#3a7acc; border-color:#0a1830; font-size:9px; letter-spacing:0; }
.ck.fx:hover { border-color:#4a9eff; color:#4a9eff; }
.ck.span2 { grid-column:span 2; }

/* ── MAIN SECTION ── */
#main-section {
  text-align:center;
  min-height: 100vh;
  min-height: 100dvh;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  background: var(--bg-hdr);
  padding: 2rem 1.5rem;
}
#main-zone { font-size:11px; letter-spacing:3px; color:var(--dim); text-transform:uppercase; margin-bottom:5px; }
#main-city { font-size:13px; letter-spacing:2px; color:#888; margin-bottom:18px; }

/* ── SEGMENT DISPLAY ── */
.seg-wrap { position:relative; display:inline-block; line-height:1; }
.seg-ghost {
  font-family: var(--seg);
  font-weight: bold;
  color: var(--off);
  position: absolute;
  top: 0; left: 0;
  pointer-events: none;
  user-select: none;
  z-index: 0;
  white-space: nowrap;
}
.seg-lit {
  font-family: var(--seg);
  font-weight: bold;
  color: var(--on);
  position: relative;
  z-index: 1;
  white-space: nowrap;
}
#main-ghost, #main-lit {
  font-size: clamp(52px, 11vw, 92px);
  letter-spacing: 5px;
  display: block;
}

#main-date { font-size:13px; color:var(--dim); margin-top:12px; letter-spacing:2px; }
#main-dst  { font-size:10px; color:var(--dst); margin-top:4px; letter-spacing:2px; min-height:14px; }
#ntp       { font-size:9px; color:#252525; margin-top:5px; letter-spacing:1px; transition:color .5s; min-height:12px; }
#ntp.ok    { color:#1e3a1e; }
#ntp.err   { color:#3a1e1e; }
#ntp.sync  { color:#2a2a1a; }

/* ── GRID ── */
#grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(168px,1fr)); gap:1px; background:#0a0a0a; }
.cell { background:var(--bg-cell); padding:12px 14px; cursor:pointer; transition:background .12s; position:relative; }
.cell:hover { background:#0c0900; }
.cell.active { background:#0a0700; outline:1.5px solid var(--on); outline-offset:-1.5px; }
.cell.active::after { content:'▲ MAIN'; position:absolute; top:4px; right:8px; font-size:8px; color:var(--on); letter-spacing:1px; }
.cname { font-size:11px; color:#999; letter-spacing:1px; margin-bottom:1px; }
.czn   { font-size:9px;  color:var(--muted); letter-spacing:1px; margin-bottom:4px; white-space:pre; }
.cdst  { font-size:8px;  color:var(--dst); letter-spacing:1px; min-height:10px; margin-bottom:2px; }

/* Cell seg display */
.cell-seg-wrap { position:relative; display:inline-block; line-height:1; }
.cell-ghost, .cell-lit {
  font-family: var(--seg);
  font-weight: bold;
  font-size: 22px;
  letter-spacing: 2px;
  display: block;
  white-space: nowrap;
}
.cell-ghost {
  color: var(--off);
  position: absolute;
  top:0; left:0;
  pointer-events:none;
  user-select:none;
  z-index:0;
}
.cell-lit {
  color: var(--on);
  position: relative;
  z-index: 1;
}

.cdate { font-size:8px; color:var(--muted); margin-top:3px; letter-spacing:1px; }

/* ── TOGGLE BARS ── */
.toggle-bar { display:flex; justify-content:center; align-items:center; gap:8px; padding:8px; background:var(--bg); cursor:pointer; user-select:none; }
.toggle-bar:hover .toggle-lbl, .toggle-bar:hover .toggle-arr { color:#444; }
.toggle-lbl { font-size:9px; color:#2a2a2a; letter-spacing:3px; text-transform:uppercase; font-family:var(--ui); }
.toggle-arr { font-size:9px; color:#2a2a2a; transition:transform .25s; }
.toggle-arr.open { transform:rotate(180deg); }

/* ── COLLAPSIBLE SECTIONS ── */

</style>
</head>
<body>

<div id="clock-body">

<script>
'use strict';
// ═══════════════════════════════════════════════════════
// STORAGE (guarded — Safari private mode / disabled storage can throw)
// ═══════════════════════════════════════════════════════
function lsGet(k, fallback) { try { const v = localStorage.getItem(k); return v === null ? fallback : v; } catch (e) { return fallback; } }
function lsSet(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
function setText(el, v) { if (el && el.textContent !== v) el.textContent = v; }
const $ = id => document.getElementById(id);

// ═══════════════════════════════════════════════════════
// ZONES
// ═══════════════════════════════════════════════════════
const ZONES = [
  {city:'Los Angeles', label:'PDT/PST',   tz:'America/Los_Angeles'},
  {city:'New York',    label:'EDT/EST',   tz:'America/New_York'},
  {city:'London',      label:'BST/GMT',   tz:'Europe/London'},
  {city:'Paris',       label:'CEST/CET',  tz:'Europe/Paris'},
  {city:'Dubai',       label:'GST',       tz:'Asia/Dubai'},
  {city:'Mumbai',      label:'IST',       tz:'Asia/Kolkata'},
  {city:'Bangkok',     label:'ICT',       tz:'Asia/Bangkok'},
  {city:'Beijing',     label:'CST',       tz:'Asia/Shanghai'},
  {city:'Seoul',       label:'KST',       tz:'Asia/Seoul'},
  {city:'Tokyo',       label:'JST',       tz:'Asia/Tokyo'},
  {city:'Sydney',      label:'AEDT/AEST', tz:'Australia/Sydney'},
  {city:'Auckland',    label:'NZDT/NZST', tz:'Pacific/Auckland'},
];
const DEFAULT_ZONE = ZONES.find(z => z.tz === 'Asia/Tokyo');
let mainZone = ZONES.find(z => z.tz === lsGet('wc_tz', '')) || DEFAULT_ZONE;

// ═══════════════════════════════════════════════════════
// TIMEKEEPING
// The clock runs on performance.now() (monotonic, never jumps) plus an
// offset to true UTC. The offset is measured against this site's own
// server (GitHub Pages / Fastly edge, which is NTP-disciplined) using the
// HTTP Date header. Date only has 1-second resolution, so we bisect:
// each probe is timed to land on the estimated second boundary, and the
// second it reports halves the uncertainty window. ~8 probes → ±(RTT/2).
// Same-origin, so no CORS and no third-party API to break.
// ═══════════════════════════════════════════════════════
const SYNC_EVERY_MS   = 10 * 60 * 1000;  // periodic resync
const SYNC_MAX_PROBES = 12;
const SYNC_TARGET_MS  = 10;              // stop once window is this narrow

let clockOff   = Date.now() - performance.now();  // UTC ms = performance.now() + clockOff
let sysOffAtSync = clockOff;                       // Date.now()-perf at the last sync (for jump detection)
let syncErr    = null;                             // ± bound of last sync, ms (null = never synced)
let lastSyncAt = 0;                                // performance.now() of last successful sync
let syncing    = false;
let syncTimer  = null;

function nowMs() { return performance.now() + clockOff; }

const sleep = ms => new Promise(r => setTimeout(r, ms));

async function probeDate() {
  const t0 = performance.now();
  const r = await fetch('manifest.json?t=' + Date.now() + Math.random(), { method: 'HEAD', cache: 'no-store' });
  const t1 = performance.now();
  const d = Date.parse(r.headers.get('date'));
  if (!r.ok || !isFinite(d)) throw new Error('no Date header');
  return { t0, t1, d };
}

async function clockSync() {
  if (syncing) return;
  syncing = true;
  clearTimeout(syncTimer);
  const el = $('ntp');
  if (syncErr === null) { el.textContent = '◎ syncing clock...'; el.className = 'sync'; }
  // Feasible interval for (serverUTC - performance.now())
  let lo = -Infinity, hi = Infinity, rtt = 50, n = 0, ok = false;
  try {
    for (let i = 0; i < SYNC_MAX_PROBES; i++) {
      if (isFinite(lo)) {
        // Wait so the request reaches the server exactly at the estimated next second boundary
        const mid = (lo + hi) / 2;
        const arrive = performance.now() + rtt / 2 + mid;
        let wait = 1000 - (((arrive % 1000) + 1000) % 1000);
        if (wait < 5) wait += 1000;
        await sleep(wait);
      }
      const p = await probeDate();
      n++;
      rtt = p.t1 - p.t0;
      const nlo = p.d - p.t1, nhi = p.d + 1000 - p.t0;
      if (nlo > hi || nhi < lo) { lo = nlo; hi = nhi; continue; } // inconsistent (clock jump?) — restart window
      lo = Math.max(lo, nlo); hi = Math.min(hi, nhi);
      if (hi - lo <= SYNC_TARGET_MS) break;
    }
    if (n >= 3 && hi - lo < 1000) {
      clockOff = (lo + hi) / 2;
      syncErr = (hi - lo) / 2;
      sysOffAtSync = Date.now() - performance.now();
      lastSyncAt = performance.now();
      ok = true;
      renderSyncStatus();
    }
  } catch (e) { /* offline, file://, etc. */ }
  if (!ok && syncErr === null) {
    clockOff = Date.now() - performance.now();
    sysOffAtSync = clockOff;
    el.textContent = '○ time server unreachable — using device clock'; el.className = 'err';
  }
  syncing = false;
  syncTimer = setTimeout(clockSync, ok ? SYNC_EVERY_MS : 60 * 1000);
}

function renderSyncStatus() {
  const el = $('ntp');
  const dev = Math.round((Date.now() - performance.now()) - clockOff); // device clock minus true time
  const devTxt = Math.abs(dev) < 1 ? 'device clock exact'
               : 'device clock ' + Math.abs(dev) + 'ms ' + (dev > 0 ? 'fast' : 'slow');
  el.textContent = '◆ synced ±' + Math.max(1, Math.round(syncErr)) + 'ms  ·  ' + devTxt;
  el.className = 'ok';
}

// Detect sleep/wake or a manual device-clock change: performance.now() can
// pause during sleep, so if Date.now() and perf drift apart by >1s, rebase
// immediately on the device clock (keeping the measured correction) and resync.
function checkClockJump() {
  const sysOff = Date.now() - performance.now();
  if (Math.abs(sysOff - sysOffAtSync) > 1000) {
    clockOff += sysOff - sysOffAtSync;
    sysOffAtSync = sysOff;
    clockSync();
  }
}

// ═══════════════════════════════════════════════════════
// TIME-ZONE HELPERS (formatters cached — creating Intl objects is slow)
// ═══════════════════════════════════════════════════════
const _fmt = {};
function fmtFor(tz, kind) {
  const key = tz + '|' + kind;
  if (!_fmt[key]) {
    const o = { timeZone: tz };
    if (kind === 'time')  Object.assign(o, { hour:'2-digit', minute:'2-digit', second:'2-digit', hourCycle:'h23' });
    if (kind === 'date')  Object.assign(o, { weekday:'short', day:'2-digit', month:'short', year:'numeric' });
    if (kind === 'parts') Object.assign(o, { year:'numeric', month:'numeric', day:'numeric', hour:'numeric', minute:'numeric', second:'numeric', hourCycle:'h23' });
    _fmt[key] = new Intl.DateTimeFormat('en-GB', o);
  }
  return _fmt[key];
}
// UTC offset in minutes for tz at instant ms
function tzOffset(tz, ms) {
  const p = {};
  fmtFor(tz, 'parts').formatToParts(new Date(ms)).forEach(x => { p[x.type] = x.value; });
  const asUTC = Date.UTC(+p.year, +p.month - 1, +p.day, +p.hour % 24, +p.minute, +p.second);
  return Math.round((asUTC - Math.floor(ms / 1000) * 1000) / 60000);
}
const _offCache = {};
function zoneInfo(tz, ms) {
  // Offsets only change on the minute (DST transitions) — cache per minute
  const minute = Math.floor(ms / 60000);
  const c = _offCache[tz];
  if (c && c.minute === minute) return c;
  const off = tzOffset(tz, ms);
  const yr = new Date(ms).getUTCFullYear();
  const jan = tzOffset(tz, Date.UTC(yr, 0, 1)), jul = tzOffset(tz, Date.UTC(yr, 6, 1));
  const s = off >= 0 ? '+' : '-', a = Math.abs(off);
  const info = {
    minute,
    dst: jan !== jul && off === Math.max(jan, jul),
    offTxt: 'UTC' + s + Math.floor(a / 60) + (a % 60 ? ':' + String(a % 60).padStart(2, '0') : ''),
  };
  _offCache[tz] = info;
  return info;
}
const zoneKey = tz => tz.replace(/\//g, '_');

// ═══════════════════════════════════════════════════════
// BUILD GRID
// ═══════════════════════════════════════════════════════
const cellEls = {};
function buildGrid() {
  const g = $('grid'); g.innerHTML = '';
  ZONES.forEach(z => {
    const k = zoneKey(z.tz);
    const cell = document.createElement('div');
    cell.className = 'cell' + (z === mainZone ? ' active' : '');
    cell.id = 'cell-' + k;

    const nr = document.createElement('div'); nr.className = 'cname'; nr.textContent = z.city;
    const zr = document.createElement('div'); zr.className = 'czn';  zr.textContent = z.label;
    const dr = document.createElement('div'); dr.className = 'cdst';

    const sw = document.createElement('div'); sw.className = 'cell-seg-wrap';
    const gh = document.createElement('span'); gh.className = 'cell-ghost'; gh.textContent = '88:88:88';
    const li = document.createElement('span'); li.className = 'cell-lit';   li.textContent = '--:--:--';
    sw.appendChild(gh); sw.appendChild(li);

    const dt = document.createElement('div'); dt.className = 'cdate';

    [nr, zr, dr, sw, dt].forEach(x => cell.appendChild(x));
    cell.addEventListener('click', () => setMain(z));
    g.appendChild(cell);
    cellEls[k] = { cell, time: li, date: dt, dst: dr, lbl: zr };
  });
}

function setMain(z) {
  mainZone = z;
  lsSet('wc_tz', z.tz);
  setText($('main-city'), z.city);
  Object.keys(cellEls).forEach(k => cellEls[k].cell.classList.toggle('active', k === zoneKey(z.tz)));
  render(nowMs());
}

// ═══════════════════════════════════════════════════════
// RENDER LOOP
// A timer wakes us ~25ms before each second boundary, then
// requestAnimationFrame polls until the boundary passes and paints on
// that very frame — so the display flips within one screen refresh
// (≤16ms) of the true second, without burning CPU all second long.
// rAF pauses in hidden tabs, which also stops rendering in the background.
// ═══════════════════════════════════════════════════════
let lastSec = -1;
const mainEls = {};

function render(ms) {
  const z = mainZone, mi = zoneInfo(z.tz, ms);
  setText(mainEls.lit,  fmtFor(z.tz, 'time').format(ms));
  setText(mainEls.date, fmtFor(z.tz, 'date').format(ms));
  setText(mainEls.zone, z.label + ' — ' + mi.offTxt);
  setText(mainEls.dst,  mi.dst ? '◆ DAYLIGHT SAVING TIME ACTIVE' : '');
  ZONES.forEach(zz => {
    const e = cellEls[zoneKey(zz.tz)], info = zoneInfo(zz.tz, ms);
    setText(e.time, fmtFor(zz.tz, 'time').format(ms));
    setText(e.date, fmtFor(zz.tz, 'date').format(ms));
    setText(e.dst,  info.dst ? '◆ DST' : '');
    setText(e.lbl,  zz.label + '  ' + info.offTxt);
  });
  pomoRender();
  zazenRender();
}

function frameWait() {
  const ms = nowMs(), sec = Math.floor(ms / 1000);
  if (sec === lastSec) { requestAnimationFrame(frameWait); return; }
  lastSec = sec;
  checkClockJump();
  render(ms);
  const toNext = 1000 - (nowMs() % 1000);
  setTimeout(() => requestAnimationFrame(frameWait), Math.max(0, toNext - 25));
}

// ═══════════════════════════════════════════════════════
// SECTION TOGGLES (open/closed state remembered)
// ═══════════════════════════════════════════════════════
const SECTIONS = { pomo:['pomo-wrap','300px'], zazen:['zazen-wrap','300px'], grid:['grid-wrap','2000px'], calc:['calc-wrap','600px'] };
let sectionState = { pomo:true, zazen:true, grid:true, calc:true };
try { Object.assign(sectionState, JSON.parse(lsGet('wc_sections', '{}'))); } catch (e) {}

function applySection(id) {
  const wrap = $(SECTIONS[id][0]), open = !!sectionState[id];
  wrap.classList.toggle('closed', !open);
  wrap.style.maxHeight = open ? SECTIONS[id][1] : '0';
  wrap.style.opacity = open ? '1' : '0';
  ['arr-' + id, 'arr-' + id + '2'].forEach(aid => { const el = $(aid); if (el) el.classList.toggle('open', open); });
}
function toggleSection(id) {
  sectionState[id] = !sectionState[id];
  lsSet('wc_sections', JSON.stringify(sectionState));
  applySection(id);
}

// ═══════════════════════════════════════════════════════
// AUDIO
// <audio> (not Web Audio) so it still plays with the iOS silent switch on.
// iOS unlocks each element only after it is played during a user gesture,
// so the first tap anywhere plays it muted (capture phase, before any button
// handler). If that same tap also asked for the gong, we don't stop it.
// ═══════════════════════════════════════════════════════
const _gongAudio = document.createElement('audio');
_gongAudio.setAttribute('x-webkit-airplay', 'deny');

let _gongPrimed = false, _gongRequested = false;
function primeGong() {
  if (_gongPrimed) return;
  _gongPrimed = true;
  if (_gongRequested) return;
  try {
    _gongAudio.muted = true;   // iOS ignores .volume, but honours .muted
    const done = () => { if (!_gongRequested) { _gongAudio.pause(); _gongAudio.currentTime = 0; } _gongAudio.muted = false; };
    const p = _gongAudio.play();
    if (p && p.then) p.then(done, () => { _gongAudio.muted = false; _gongPrimed = false; }); else done();
  } catch (e) { _gongAudio.muted = false; }
}
document.addEventListener('touchend', primeGong, { capture: true, passive: true });
document.addEventListener('click',    primeGong, { capture: true, passive: true });

function playGong() {
  _gongRequested = true;
  try {
    _gongAudio.muted = false;
    _gongAudio.volume = 1;
    _gongAudio.currentTime = 0;
    const p = _gongAudio.play();
    if (p && p.catch) p.catch(() => {});
  } catch (e) {}
}

// ═══════════════════════════════════════════════════════
// TIMER HELPER — deadline based, so it can't drift and stays right when the
// tab is in the background (browsers throttle setInterval there).
// A single one-shot timeout fires the end gong at the exact deadline.
// ═══════════════════════════════════════════════════════
function mmss(totalSec) {
  const m = Math.floor(totalSec / 60), s = totalSec % 60;
  return String(m).padStart(2, '0') + ':' + String(s).padStart(2, '0');
}
function makeTimer(onEnd) {
  const t = { state: 'idle', leftMs: 0, endAt: 0, to: null };
  t.set = ms => { t.stop(); t.state = 'idle'; t.leftMs = ms; };
  t.remainingMs = () => t.state === 'running' ? Math.max(0, t.endAt - nowMs()) : t.leftMs;
  t.secsLeft = () => Math.ceil(t.remainingMs() / 1000);
  t.start = () => {
    t.state = 'running';
    // Round the deadline up to a whole clock second so the countdown flips in step with the clock (adds <1s)
    t.endAt = Math.ceil((nowMs() + t.leftMs) / 1000) * 1000;
    t.leftMs = t.endAt - nowMs();
    clearTimeout(t.to);
    t.to = setTimeout(t.check, t.leftMs + 5);
  };
  t.pause = () => { t.leftMs = t.remainingMs(); t.stop(); t.state = 'paused'; };
  t.stop  = () => { clearTimeout(t.to); t.to = null; };
  t.check = () => {
    if (t.state !== 'running') return;
    const left = t.endAt - nowMs();
    if (left > 0) { clearTimeout(t.to); t.to = setTimeout(t.check, left + 5); return; }
    t.stop(); t.state = 'idle'; t.leftMs = 0; onEnd();
  };
  return t;
}

// POMODORO ENGINE
// ═══════════════════════════════════════════════════════
const POMO = { work: 25 * 60e3, short: 5 * 60e3, long: 15 * 60e3 };
let pomoMode  = 'work';  // work | short | long
let pomoCycle = 0;       // completed work sessions in this set (0-3)
const pomo = makeTimer(pomoFinished);
pomo.set(POMO.work);

function pomoAdvance() {
  if (pomoMode === 'work') {
    pomoCycle++;
    pomoMode = pomoCycle >= 4 ? 'long' : 'short';
    if (pomoCycle >= 4) pomoCycle = 0;
  } else {
    pomoMode = 'work';
  }
  pomo.set(POMO[pomoMode]);
}
function pomoFinished() { playGong(); pomoAdvance(); pomoRender(true); }

function pomoModeLabel() {
  if (pomoMode === 'work')  return 'work  ·  session ' + (pomoCycle + 1) + ' of 4';
  if (pomoMode === 'short') return 'short break';
  return 'long break';
}

let _pomoDotsCycle = -1;
function pomoRender(force) {
  setText($('pomo-lit'), mmss(pomo.secsLeft()));
  setText($('pomo-header'), pomoModeLabel());
  setText($('pbtn-start'), pomo.state === 'running' ? '⏸ pause' : '▶ start');
  if (force || _pomoDotsCycle !== pomoCycle) {
    _pomoDotsCycle = pomoCycle;
    const el = $('pomo-dots'); el.innerHTML = '';
    for (let i = 0; i < 4; i++) {
      const d = document.createElement('div');
      d.className = 'pdot' + (i < pomoCycle ? ' done' : '');
      el.appendChild(d);
    }
  }
}

function pomoStart() {
  if (pomo.state === 'running') pomo.pause();
  else {
    if (pomo.state === 'idle') playGong();  // gong only on a fresh start, not on resume
    pomo.start();
  }
  pomoRender();
}
function pomoReset() { pomo.set(POMO.work); pomoMode = 'work'; pomoCycle = 0; pomoRender(true); }
function pomoSkip()  { pomoAdvance(); playGong(); pomoRender(true); }

// ZAZEN ENGINE
// ═══════════════════════════════════════════════════════
let zazenMins = 5;
let zazenCustomMode = false;
const zazen = makeTimer(() => { playGong(); zazenRender(); });

function zazenSetPreset(mins) {
  zazenMins = mins; zazenCustomMode = false;
  document.querySelectorAll('.zpre').forEach(b => b.classList.toggle('zsel', b.dataset.mins === String(mins)));
  $('zazen-custom-input').classList.remove('visible');
  $('zazen-custom-unit').classList.remove('visible');
}
function zazenSetCustom() {
  zazenCustomMode = true;
  document.querySelectorAll('.zpre').forEach(b => b.classList.remove('zsel'));
  $('zpre-custom').classList.add('zsel');
  const inp = $('zazen-custom-input');
  inp.classList.add('visible');
  inp.value = zazenMins;
  $('zazen-custom-unit').classList.add('visible');
  inp.focus();
}
function zazenCustomChange(val) {
  const v = parseInt(val, 10);
  if (v > 0 && v <= 999) zazenMins = v;
}
function zazenBegin() {
  if (zazenCustomMode) zazenCustomChange($('zazen-custom-input').value);
  $('zazen-idle').style.display = 'none';
  $('zazen-running').style.display = 'block';
  setText($('zazen-header'), 'meditation timer · ' + zazenMins + ' min');
  setText($('zbtn-pause'), '⏸ pause');
  zazen.set(zazenMins * 60e3);
  zazen.start();
  playGong();
  zazenRender();
}
function zazenRender() {
  if ($('zazen-running').style.display === 'none') return;
  setText($('zazen-lit'), mmss(zazen.secsLeft()));
}
function zazenPause() {
  if (zazen.state === 'running')     { zazen.pause(); setText($('zbtn-pause'), '▶ resume'); }
  else if (zazen.state === 'paused') { zazen.start(); setText($('zbtn-pause'), '⏸ pause'); }
}
function zazenReset() {
  zazen.set(zazenMins * 60e3);
  $('zazen-running').style.display = 'none';
  $('zazen-idle').style.display = 'block';
  setText($('zazen-header'), 'meditation timer');
  setText($('zbtn-pause'), '⏸ pause');
}

// LIVE USD/JPY RATE
// api.frankfurter.app now 302-redirects to api.frankfurter.dev without CORS
// headers, so browsers block it — that's why "live" stopped working.
// Now: several sources with fallback, a timeout, hourly refresh, and the last
// good rate cached so the converter still works offline.
// ═══════════════════════════════════════════════════════
const FX_SOURCES = [
  { name: 'frankfurter',      url: 'https://api.frankfurter.dev/v2/rate/usd/jpy',
    parse: j => ({ rate: j.rate, date: j.date }) },
  { name: 'exchangerate-api', url: 'https://open.er-api.com/v6/latest/USD',
    parse: j => ({ rate: j.rates && j.rates.JPY, date: j.time_last_update_unix ? new Date(j.time_last_update_unix * 1000).toISOString().slice(0, 10) : '' }) },
  { name: 'frankfurter v1',   url: 'https://api.frankfurter.dev/v1/latest?from=USD&to=JPY',
    parse: j => ({ rate: j.rates && j.rates.JPY, date: j.date }) },
];
const FX_REFRESH_MS = 60 * 60 * 1000;

let _fx = null;      // { rate, date, source, fetchedAt }
let _fxLive = false; // true if fetched this session
try { const c = JSON.parse(lsGet('wc_fx', 'null')); if (c && c.rate > 0) _fx = c; } catch (e) {}

async function fetchJSON(url, timeoutMs) {
  const ctl = typeof AbortController !== 'undefined' ? new AbortController() : null;
  const t = ctl ? setTimeout(() => ctl.abort(), timeoutMs) : null;
  try {
    const r = await fetch(url, { cache: 'no-store', signal: ctl ? ctl.signal : undefined });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    return await r.json();
  } finally { if (t) clearTimeout(t); }
}

let _fxInflight = null;
function fxFetch() {
  if (_fxInflight) return _fxInflight;
  _fxInflight = (async () => {
    for (const src of FX_SOURCES) {
      try {
        const v = src.parse(await fetchJSON(src.url, 6000));
        const rate = Number(v.rate);
        if (rate > 50 && rate < 500) {   // sanity check
          _fx = { rate, date: v.date || '', source: src.name, fetchedAt: Date.now() };
          _fxLive = true;
          lsSet('wc_fx', JSON.stringify(_fx));
          break;
        }
      } catch (e) {}
    }
    fxRenderBadge();
    _fxInflight = null;
  })();
  return _fxInflight;
}

function fxStatus() {
  if (!_fx) return 'offline';
  return _fxLive ? 'live' : 'cached';
}
function fxRenderBadge() {
  const input = $('calc-rate-input'), badge = $('calc-rate-badge');
  input.placeholder = _fx ? _fx.rate.toFixed(2) : 'live';
  if (calcManualRate()) { badge.textContent = 'manual'; badge.className = 'manual'; return; }
  const s = fxStatus();
  badge.textContent = s === 'offline' ? 'no rate' : s;
  badge.className = s;
  badge.title = _fx ? ('USD/JPY ' + _fx.rate + ' · ' + _fx.source + (_fx.date ? ' · ' + _fx.date : '')) : 'rate unavailable';
}

// ═══════════════════════════════════════════════════════
// CALCULATOR ENGINE
// calcVal always holds a plain number string; calcUnit is a display prefix
// ($ or ¥) after a conversion, so results can be used in further maths.
// ═══════════════════════════════════════════════════════
let calcVal   = '0';   // current entry (plain number string or 'ERR')
let calcUnit  = '';    // '' | '$' | '¥'
let calcPrev  = null;  // previous operand
let calcOper  = null;  // pending operator
let calcFresh = false; // next digit replaces display

function calcFmt(v) { return Number(v).toLocaleString('en-US', { maximumFractionDigits: 10 }); }
function calcDisp() {
  let txt = calcVal;
  if (calcUnit === '¥') txt = '¥' + calcFmt(calcVal);
  else if (calcUnit === '$') txt = '$' + Number(calcVal).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  setText($('calc-main'), txt);
}
function calcClearRateLine() { const rl = $('calc-rate'); rl.textContent = ' '; rl.className = ''; }

function calcNum(n) {
  if (calcFresh || calcVal === 'ERR') { calcVal = n; calcFresh = false; calcUnit = ''; }
  else calcVal = calcVal === '0' ? n : (calcVal === '-0' ? '-' + n : calcVal + n);
  calcDisp();
}
function calcDot() {
  if (calcFresh || calcVal === 'ERR') { calcVal = '0.'; calcFresh = false; calcUnit = ''; }
  else if (!calcVal.includes('.')) calcVal += '.';
  calcDisp();
}
function calcApply(a, op, b) {
  let r;
  if (op === '+') r = a + b;
  else if (op === '−') r = a - b;
  else if (op === '×') r = a * b;
  else if (op === '÷') r = b !== 0 ? a / b : NaN;
  return isFinite(r) ? String(parseFloat(r.toPrecision(12))) : 'ERR';
}
function calcOp(op) {
  if (calcVal === 'ERR') return;
  // Chain: 2 + 3 × → evaluates 2 + 3 first
  if (calcOper !== null && calcPrev !== null && !calcFresh) {
    calcVal = calcApply(calcPrev, calcOper, parseFloat(calcVal));
    calcDisp();
    if (calcVal === 'ERR') { calcOper = null; calcPrev = null; return; }
  }
  calcPrev = parseFloat(calcVal);
  calcOper = op;
  calcFresh = true;
  setText($('calc-expr'), calcFmt(calcPrev) + ' ' + op);
}
function calcEq() {
  if (calcOper === null || calcPrev === null || calcVal === 'ERR') return;
  const a = calcPrev, b = parseFloat(calcVal);
  setText($('calc-expr'), calcFmt(a) + ' ' + calcOper + ' ' + calcFmt(b) + ' =');
  calcVal = calcApply(a, calcOper, b);
  calcUnit = '';  // units are shown only directly after a conversion
  calcDisp();
  calcOper = null; calcPrev = null; calcFresh = true;
}
function calcAC() {
  calcVal = '0'; calcUnit = ''; calcPrev = null; calcOper = null; calcFresh = false;
  setText($('calc-expr'), ' ');
  calcClearRateLine();
  calcDisp();
}
function calcSign() {
  if (calcVal === '0' || calcVal === 'ERR') return;
  calcVal = calcVal.startsWith('-') ? calcVal.slice(1) : '-' + calcVal;
  calcDisp();
}
function calcPct() {
  if (calcVal === 'ERR') return;
  calcVal = String(parseFloat((parseFloat(calcVal) / 100).toPrecision(12)));
  calcDisp();
}
function calcBackspace() {
  if (calcFresh || calcVal === '0' || calcVal === 'ERR') return;
  calcVal = calcVal.length > 1 && calcVal !== '-0' ? calcVal.slice(0, -1) : '0';
  if (calcVal === '-') calcVal = '0';
  calcDisp();
}

function calcManualRate() {
  const v = parseFloat($('calc-rate-input').value.trim().replace(/[^0-9.]/g, ''));
  return v > 0 ? v : null;
}
function calcRateInput() { fxRenderBadge(); }
function calcRateClear() { $('calc-rate-input').value = ''; fxRenderBadge(); }

async function calcFx(dir) {
  if (calcVal === 'ERR') return;
  const manual = calcManualRate();
  if (!manual) { if (!_fx) await fxFetch(); else if (!_fxLive) fxFetch(); }  // use cache instantly, refresh in background
  const rate = manual || (_fx && _fx.rate);
  const rl = $('calc-rate');
  if (!rate) { rl.textContent = 'rate unavailable — check connection or enter a rate'; rl.className = ''; return; }

  const v = parseFloat(calcVal);
  if (isNaN(v)) return;
  if (dir === 'jpy2usd') {
    setText($('calc-expr'), '¥' + calcFmt(v) + ' ÷ ' + rate.toFixed(2));
    calcVal = (v / rate).toFixed(2); calcUnit = '$';
  } else {
    setText($('calc-expr'), '$' + calcFmt(v) + ' × ' + rate.toFixed(2));
    calcVal = String(Math.round(v * rate)); calcUnit = '¥';
  }
  calcDisp();
  if (manual) { rl.textContent = 'USD/JPY ' + rate.toFixed(2) + '  ·  manual'; rl.className = 'manual'; }
  else {
    rl.textContent = 'USD/JPY ' + rate.toFixed(2) + '  ·  ' + _fx.source + (_fx.date ? '  ·  ' + _fx.date : '') + (_fxLive ? '' : '  ·  cached');
    rl.className = _fxLive ? 'live' : 'cached';
  }
  calcOper = null; calcPrev = null; calcFresh = true;
}

// ── Calculator keyboard ──────────────────────────────────
document.addEventListener('keydown', function (e) {
  if (!sectionState.calc) return;
  if (e.ctrlKey || e.metaKey || e.altKey) return;           // don't hijack browser shortcuts (Cmd+1 etc.)
  const t = e.target;
  if (t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.isContentEditable)) return;
  const key = e.key;
  const map = {
    '.': calcDot, ',': calcDot, '+': () => calcOp('+'), '-': () => calcOp('−'), '*': () => calcOp('×'),
    '/': () => calcOp('÷'), 'Enter': calcEq, '=': calcEq, 'Backspace': calcBackspace, 'Escape': calcAC, '%': calcPct,
  };
  if (key >= '0' && key <= '9' && key.length === 1) { e.preventDefault(); calcNum(key); }
  else if (map[key]) { e.preventDefault(); map[key](); }
});

// ═══════════════════════════════════════════════════════
// INIT
// ═══════════════════════════════════════════════════════
mainEls.lit  = $('main-lit');
mainEls.date = $('main-date');
mainEls.zone = $('main-zone');
mainEls.dst  = $('main-dst');

buildGrid();
setText($('main-city'), mainZone.city);
Object.keys(SECTIONS).forEach(applySection);
zazenSetPreset(5);
pomoRender(true);
calcDisp();
fxRenderBadge();

requestAnimationFrame(frameWait);
render(nowMs());
clockSync();
fxFetch();
setInterval(fxFetch, FX_REFRESH_MS);

// Coming back to the tab / waking the device: repaint now, check timers, resync if stale
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState !== 'visible') return;
  checkClockJump();
  pomo.check(); zazen.check();
  render(nowMs());
  if (performance.now() - lastSyncAt > SYNC_EVERY_MS / 2) clockSync();
  if (!_fx || Date.now() - (_fx.fetchedAt || 0) > FX_REFRESH_MS) fxFetch();
});
window.addEventListener('online', () => { clockSync(); fxFetch(); });

// Show clock only after DSEG7Bold is confirmed loaded — prevents any fallback flash
const showBody = () => $('clock-body').classList.add('ready');
if (document.fonts && document.fonts.load) document.fonts.load('bold 92px DSEG7Bold').then(showBody, showBody);
else showBody();
setTimeout(showBody, 3000); // safety net
</script>
